name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* git tag matching HEAD & package.json version (immutable release)'
        required: false

permissions:
  contents: write
  checks: read
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Enforce immutable release and tag-to-source provenance
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          PKG_VER="$(node -p "require('./package.json').version")"
          ANDROID_VER="$(sed -nE "s/^[[:space:]]*versionName '([^']+)'.*/\1/p" android/app/build.gradle | head -n1)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${INPUT_TAG:-v${PKG_VER}}"
          fi

          if [ "${TAG}" != "v${PKG_VER}" ]; then
            echo "ERROR: Tag '${TAG}' does not match package.json version 'v${PKG_VER}'." >&2
            exit 1
          fi
          if [ "${ANDROID_VER}" != "${PKG_VER}" ]; then
            echo "ERROR: Android versionName '${ANDROID_VER}' does not match package.json '${PKG_VER}'." >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "ERROR: Git tag '${TAG}' must exist before publishing a release." >&2
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if [ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]; then
            echo "ERROR: Tag '${TAG}' (${TAG_COMMIT}) does not match checkout HEAD (${GITHUB_SHA})." >&2
            exit 1
          fi
          git fetch origin main --depth=50
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "ERROR: Tagged commit ${GITHUB_SHA} is not an ancestor of origin/main." >&2
            exit 1
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "ERROR: Release '${TAG}' already exists. Immutable release policy forbids overwriting existing releases or assets." >&2
            exit 1
          fi

          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Wait for and verify all required CI check-runs on tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const sha = process.env.GITHUB_SHA;
            const repo = process.env.GITHUB_REPOSITORY;
            const required = ["verify", "android-apk", "android-release-upgrade"];
            const deadline = Date.now() + 22 * 60 * 1000;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            (async () => {
              while (true) {
                const raw = execFileSync("gh", ["api", `repos/${repo}/commits/${sha}/check-runs?per_page=100`], { encoding: "utf8" });
                const runs = JSON.parse(raw).check_runs || [];
                const statusMap = {};
                let allGreen = true;
                for (const name of required) {
                  const latest = runs.filter((r) => r.name === name).sort((a, b) => Number(b.id) - Number(a.id))[0];
                  statusMap[name] = latest ? `${latest.status}/${latest.conclusion}` : "missing";
                  if (latest && latest.status === "completed" && latest.conclusion !== "success") {
                    console.error(`RELEASE GATE FAILED: Check-run "${name}" on ${sha} concluded with ${latest.conclusion}`);
                    process.exit(1);
                  }
                  if (!latest || latest.status !== "completed" || latest.conclusion !== "success") {
                    allGreen = false;
                  }
                }
                console.log(`CI gate status for ${sha}:`, JSON.stringify(statusMap));
                if (allGreen) {
                  console.log("All required CI check-runs succeeded before Release build/publish.");
                  process.exit(0);
                }
                if (Date.now() > deadline) {
                  console.error(`RELEASE GATE TIMED OUT waiting for CI on ${sha}:`, JSON.stringify(statusMap));
                  process.exit(1);
                }
                await sleep(20_000);
              }
            })();
          '

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 build-tools;34.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify checks before packaging
        run: |
          pnpm format:check
          pnpm type
          pnpm lint
          pnpm lint:extra
          pnpm build
          pnpm test

      - name: Build Android Debug APK
        run: pnpm android:apk

      - name: Build Optional Signed Android Release APK
        env:
          DS_KEYSTORE_BASE64: ${{ secrets.DS_KEYSTORE_BASE64 }}
          DS_KEYSTORE_PASSWORD: ${{ secrets.DS_KEYSTORE_PASSWORD }}
          DS_KEY_ALIAS: ${{ secrets.DS_KEY_ALIAS }}
          DS_KEY_PASSWORD: ${{ secrets.DS_KEY_PASSWORD }}
        run: |
          if [ -z "${DS_KEYSTORE_BASE64}" ]; then
            echo "DS_KEYSTORE_BASE64 secret not set; skipping release-key APK signing."
            exit 0
          fi
          KEYSTORE_FILE="${RUNNER_TEMP}/release-keystore.jks"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "${DS_KEYSTORE_BASE64}" | base64 -d > "$KEYSTORE_FILE"
          DS_KEYSTORE_PATH="$KEYSTORE_FILE" pnpm android:release

      - name: Package release assets and checksums
        run: |
          ASSETS_DIR="${RUNNER_TEMP}/release-assets"
          rm -rf "$ASSETS_DIR" && mkdir -p "$ASSETS_DIR"
          echo "ASSETS_DIR=${ASSETS_DIR}" >> "$GITHUB_ENV"

          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "${ASSETS_DIR}/deepseek-chat-byok-${RELEASE_TAG}-android-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk \
              "${ASSETS_DIR}/deepseek-chat-byok-${RELEASE_TAG}-android-release.apk"
          fi

          STAGE_DIR="${RUNNER_TEMP}/portable-${RELEASE_TAG}"
          rm -rf "$STAGE_DIR" && mkdir -p "$STAGE_DIR/scripts"
          cp -r dist "$STAGE_DIR/dist"
          cp server.mjs package.json LICENSE README.md README.zh-CN.md SECURITY.md Dockerfile "$STAGE_DIR/"
          cp scripts/start-desktop.sh scripts/start-desktop.ps1 scripts/start-lan.sh "$STAGE_DIR/scripts/"
          cp scripts/start-desktop-windows.bat "$STAGE_DIR/Start-Windows.bat"
          cp scripts/start-desktop-macos.command "$STAGE_DIR/Start-macOS.command"
          chmod +x "$STAGE_DIR/Start-macOS.command" "$STAGE_DIR/scripts/start-desktop.sh" "$STAGE_DIR/scripts/start-lan.sh"
          printf '%s\n' \
            "DeepSeek Chat BYOK - Portable Desktop Quick Start" \
            "=================================================" \
            "" \
            "Requirement: Node.js 22+ LTS (https://nodejs.org/)" \
            "" \
            "- Windows: Double-click Start-Windows.bat" \
            "- macOS: Double-click Start-macOS.command (if Gatekeeper prompts, Right-click -> Open)" \
            "- Linux / Terminal: Run ./scripts/start-desktop.sh" \
            "" \
            "All local API keys and chat history stay on this machine." \
            "Zero hosted fees, zero shared keys." \
            > "$STAGE_DIR/README-START.txt"
          (cd "$STAGE_DIR" && zip -qr "${ASSETS_DIR}/deepseek-chat-byok-${RELEASE_TAG}-portable.zip" .)

          (cd "$ASSETS_DIR" && sha256sum * > SHA256SUMS.txt)
          cat "${ASSETS_DIR}/SHA256SUMS.txt"

      - name: Publish Immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "ERROR: Release '${RELEASE_TAG}' already exists; aborting before publish." >&2
            exit 1
          fi

          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          HAS_RELEASE_APK=false
          if [ -f "${ASSETS_DIR}/deepseek-chat-byok-${RELEASE_TAG}-android-release.apk" ]; then
            HAS_RELEASE_APK=true
          fi

          {
            printf '%s\n' \
              "## DeepSeek Chat BYOK ${RELEASE_TAG}" \
              "" \
              "- **Source Provenance**: Tag \`${RELEASE_TAG}\` at commit \`${GITHUB_SHA}\`" \
              "- **Web / PWA**: https://kamanager2012.github.io/deepseek-chat-byok/" \
              "- **Security Policy & Signing Guide**: [SECURITY.md](https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/SECURITY.md)" \
              "" \
              "### Included Hardening & Upgrade Guidance" \
              "- Enforces non-destructive same-ID archive merge (keeps existing local turns by default with explicit conflict options), per-session verified emergency backups, and CI-gated Pages/Release provenance checks." \
              "- Includes loopback DNS-rebinding \`Host\` header checks on \`/_proxy\`, DNS-pinned TLS upstream connections, Android \`X-DS-Bridge-Token\` + canonical \`127.0.0.1:18787\` origin isolation, API error secret redaction (\`redactApiSecrets()\`), SAF export bounds, and strict external link filtering."
            if [ "${HAS_RELEASE_APK}" = "true" ]; then
              printf '%s\n' \
                "- **Android Release APK (\`*-android-release.apk\`) — Recommended**: Signed with the persistent release certificate (SHA-256 \`86d829e21571afedfcae690f240ada7f338e4c10fd9997ddc7a18ae9da91ada7\`). Upgrading between \`v0.2.2+\` \`android-release.apk\` builds preserves local chats, Memory Cards, and API keys without uninstalling. If migrating from an older CI debug build (\`v0.2.0\`, \`v0.2.1\`, or \`*-android-debug.apk\`), export your chats first (**Settings -> Data -> Export all chats**), uninstall the debug APK, install \`*-android-release.apk\`, and re-import your backup." \
                "- **Android Debug APK (\`*-android-debug.apk\`)**: Ephemeral CI debug build retained only for fallback diagnostics; incompatible for in-place upgrades with the Release certificate."
            else
              printf '%s\n' \
                "- **Android APK (\`android-debug.apk\`)**: Signed with an ephemeral CI debug keystore. **Do not assume in-place upgrades work across CI debug builds**: before switching versions without a fixed release keystore, export your chats via **Settings -> Data -> Export all chats** first, uninstall the older APK cleanly, install the new APK, re-import your ZIP backup, and re-enter your API key(s)."
            fi
            printf '%s\n' \
              "- **Portable Bundle (\`portable.zip\`)**: Prebuilt \`dist/\` + zero-dependency Node 22 \`server.mjs\` + double-click desktop launchers (\`Start-Windows.bat\`, \`Start-macOS.command\`, \`./scripts/start-desktop.sh\`). Requires Node.js 22+."
          } > "$NOTES_FILE"

          gh release create "${RELEASE_TAG}" "${ASSETS_DIR}"/* \
            --verify-tag \
            --title "DeepSeek Chat BYOK ${RELEASE_TAG}" \
            --notes-file "$NOTES_FILE"

      - name: Trigger GitHub Pages installer mirror refresh
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: gh workflow run pages.yml --ref main
