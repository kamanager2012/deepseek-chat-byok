name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (defaults to v<package.json version>)'
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 build-tools;34.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify checks before packaging
        run: |
          pnpm format:check
          pnpm type
          pnpm lint
          pnpm lint:extra
          pnpm build
          pnpm test

      - name: Build Android Debug APK
        run: pnpm android:apk

      - name: Build Optional Signed Android Release APK
        env:
          DS_KEYSTORE_BASE64: ${{ secrets.DS_KEYSTORE_BASE64 }}
          DS_KEYSTORE_PASSWORD: ${{ secrets.DS_KEYSTORE_PASSWORD }}
          DS_KEY_ALIAS: ${{ secrets.DS_KEY_ALIAS }}
          DS_KEY_PASSWORD: ${{ secrets.DS_KEY_PASSWORD }}
        run: |
          if [ -z "${DS_KEYSTORE_BASE64}" ]; then
            echo "DS_KEYSTORE_BASE64 secret not set; skipping release-key APK signing."
            exit 0
          fi
          KEYSTORE_FILE="${RUNNER_TEMP}/release-keystore.jks"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "${DS_KEYSTORE_BASE64}" | base64 -d > "$KEYSTORE_FILE"
          DS_KEYSTORE_PATH="$KEYSTORE_FILE" pnpm android:release

      - name: Package release assets and checksums
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG="${INPUT_TAG:-v$(node -p "require('./package.json').version")}"
          fi
          ASSETS_DIR="${RUNNER_TEMP}/release-assets"
          rm -rf "$ASSETS_DIR" && mkdir -p "$ASSETS_DIR"
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "ASSETS_DIR=${ASSETS_DIR}" >> "$GITHUB_ENV"

          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "${ASSETS_DIR}/deepseek-chat-byok-${TAG}-android-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk \
              "${ASSETS_DIR}/deepseek-chat-byok-${TAG}-android-release.apk"
          fi

          STAGE_DIR="${RUNNER_TEMP}/portable-${TAG}"
          rm -rf "$STAGE_DIR" && mkdir -p "$STAGE_DIR/scripts"
          cp -r dist "$STAGE_DIR/dist"
          cp server.mjs package.json LICENSE README.md README.zh-CN.md Dockerfile "$STAGE_DIR/"
          cp scripts/start-desktop.sh scripts/start-desktop.ps1 scripts/start-lan.sh "$STAGE_DIR/scripts/"
          (cd "$STAGE_DIR" && zip -qr "${ASSETS_DIR}/deepseek-chat-byok-${TAG}-portable.zip" .)

          (cd "$ASSETS_DIR" && sha256sum * > SHA256SUMS.txt)
          cat "${ASSETS_DIR}/SHA256SUMS.txt"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          printf '%s\n' \
            "## DeepSeek Chat BYOK ${RELEASE_TAG}" \
            "" \
            "Pure local-first BYOK chat client, creative writing workspace, and selective DeepSeek \`export_format_version: 3\` archive importer." \
            "" \
            "- **Web / PWA**: https://kamanager2012.github.io/deepseek-chat-byok/" \
            "- **Android APK (\`android-debug.apk\`)**: Installable directly on Android devices (built-in \`127.0.0.1:18787\` streaming \`/_proxy\`, file picker & SAF export). Signed with the CI debug keystore — uninstall prior debug builds if upgrading across unrelated runners unless a shared release keystore is used." \
            "- **Portable Bundle (\`portable.zip\`)**: Prebuilt \`dist/\` + zero-dependency Node 22 \`server.mjs\` + desktop/LAN launchers (\`./scripts/start-desktop.sh\` or \`./scripts/start-desktop.ps1\`)." \
            > "$NOTES_FILE"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${ASSETS_DIR}"/* --clobber
          else
            gh release create "${RELEASE_TAG}" "${ASSETS_DIR}"/* \
              --title "DeepSeek Chat BYOK ${RELEASE_TAG}" \
              --notes-file "$NOTES_FILE"
          fi
