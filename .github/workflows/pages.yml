name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      pages: write
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Verify full CI check-runs succeeded for target SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const sha = process.env.TARGET_SHA;
            const repo = process.env.GITHUB_REPOSITORY;
            const raw = execFileSync("gh", ["api", `repos/${repo}/commits/${sha}/check-runs?per_page=100`], { encoding: "utf8" });
            const runs = JSON.parse(raw).check_runs || [];
            const required = ["verify", "android-apk", "android-release-upgrade"];
            for (const name of required) {
              const matched = runs.filter((r) => r.name === name);
              const latest = matched.sort((a, b) => Number(b.id) - Number(a.id))[0];
              if (!latest || latest.status !== "completed" || latest.conclusion !== "success") {
                console.error(`GATE BLOCKED: Check-run "${name}" on ${sha} is ${latest ? `${latest.status}/${latest.conclusion}` : "missing"}`);
                process.exit(1);
              }
            }
            console.log(`CI gate verified on ${sha}: ${required.join(", ")} all completed/success.`);
          '

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm type

      - name: Lint
        run: pnpm lint

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Build
        run: pnpm build

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
