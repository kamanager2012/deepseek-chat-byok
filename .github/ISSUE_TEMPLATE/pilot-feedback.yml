name: Pilot Feedback / 试用体验与冷启动卡点反馈
description: Report first-run onboarding, export tutorial, archive migration, or reply setup issues (v0.4.0+).
title: '[Pilot v0.4.1] '
labels:
  - pilot-feedback
body:
  - type: markdown
    attributes:
      value: |
        > **Privacy Notice / 隐私安全提醒**
        > 严禁在公开 Issue 中粘贴 API Key（`sk-...`）、个人聊天正文或原始导出 `.zip` 压缩包！仅填写卡住的步骤与脱敏提示。

  - type: dropdown
    id: platform
    attributes:
      label: Platform / 使用方式
      options:
        - Web / PWA (在线网页版)
        - Android APK (v0.4.0+ android-release.apk)
        - Portable Desktop (Node.js 22+ 便携包)
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App Version & Device/Browser / 版本号、设备与网络环境
      placeholder: '例如：v0.4.1 · 华为/小米安卓浏览器直连，国内宽带未开代理'
    validations:
      required: true

  - type: checkboxes
    id: funnel_steps
    attributes:
      label: 4 个关键节点完成情况（请勾选你顺利完成了哪几步）
      options:
        - label: ① 顺利找到并打开了产品主页 / 安装页（国内网络可达）
        - label: ② 成功从 DeepSeek 官网或 App 导出了 .zip 压缩包
        - label: ③ 不填 API Key 成功导入了旧聊天，并能找到以前的某一段对话
        - label: ④ 理解导入免费 vs 续聊按模型服务商计费，并完成了首次配置续聊

  - type: dropdown
    id: first_run_result
    attributes:
      label: First-Run Setup / 首次完成情况
      options:
        - 独立完成了搬家并成功续聊
        - 仅完成了导入和查看旧聊天，卡在配置模型/API Key
        - 卡在找不到导出入口或无法导入 ZIP
        - 打不开网页或下载安装包失败
    validations:
      required: true

  - type: dropdown
    id: migration_result
    attributes:
      label: Archive Source / 导入包来源
      options:
        - DeepSeek 手机 App 导出 ZIP
        - DeepSeek 电脑网页版导出 ZIP
        - 客户端内置备份导出 ZIP
        - 尚未导出
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider Used / 续聊所用服务商（严禁填密钥）
      placeholder: '例如：还没配模型（仅看旧记录）/ DeepSeek 官方 / 硅基流动 / 本地 Ollama'

  - type: textarea
    id: details
    attributes:
      label: 卡在哪一步或有哪些地方没看懂？（已脱敏）
      placeholder: '请直接用大白话告诉我们：哪句话没看懂、哪个按钮找不到、或者报了什么提示。'
    validations:
      required: true

  - type: checkboxes
    id: privacy_check
    attributes:
      label: Privacy Confirmation / 脱敏确认
      options:
        - label: 我确认未包含 API Key、个人对话原文或原始聊天导出压缩包。
          required: true
